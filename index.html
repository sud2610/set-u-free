<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sector Oracle — Roulette Pattern Analyser</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .landing {
            max-width: 640px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .landing-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 6vw, 2.6rem);
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--blue);
            margin-bottom: 8px;
        }
        .landing-sub {
            font-size: 0.9rem;
            letter-spacing: 0.25em;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 48px;
        }
        .landing-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        @media (max-width: 520px) {
            .landing-cards {
                grid-template-columns: 1fr;
            }
        }
        .landing-card {
            display: block;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 24px;
            text-decoration: none;
            color: inherit;
            transition: all 0.25s;
        }
        .landing-card:hover {
            border-color: var(--blue);
            transform: translateY(-4px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.15);
        }
        .landing-card h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: var(--blue);
            margin-bottom: 8px;
        }
        .landing-card p {
            font-size: 0.82rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
            line-height: 1.5;
        }
        .fixed-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .fixed-nav a {
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .fixed-nav a:hover { color: var(--blue); }
        .fixed-nav a.active { color: var(--blue); font-weight: 600; }
        .fixed-nav .nav-brand { color: var(--blue); font-weight: 700; margin-right: auto; }
        .app { padding-top: 56px; }
    </style>
</head>

<body>
    <nav class="fixed-nav">
        <a href="index.html" class="nav-brand">SECTOR ORACLE</a>
        <a href="index.html" class="active">Home</a>
        <a href="basic.html">Basic</a>
        <a href="advance.html">Advanced</a>
    </nav>
    <div class="app">
        <div class="landing">
            <h1 class="landing-title">SECTOR ORACLE</h1>
            <p class="landing-sub">Roulette Wheel Pattern Analyser</p>
            <div class="landing-cards">
                <a href="basic.html" class="landing-card">
                    <h2>Basic</h2>
                    <p>Core analysis: spin entry, sector map, transition matrix, and predictions</p>
                </a>
                <a href="advance.html" class="landing-card">
                    <h2>Advanced</h2>
                    <p>Full feature set with arc analysis and detailed pattern insights</p>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
