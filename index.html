<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Table Scanner</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>🎰 ROULETTE SCANNER</h1>
            <p>Detect Sector Clustering &amp; Predict Winning Numbers</p>
        </div>

        <!-- TABLE TYPE SELECTOR -->
        <div class="selector-section">
            <label class="selector-label">📊 Select Roulette Table Type</label>
            <select class="selector-dropdown" id="tableTypeSelector" onchange="app.changeTableType(this.value)">
                <option value="triple-zero">Triple Zero (0, 00, 000)</option>
                <option value="american">American Double Zero (0, 00)</option>
                <option value="european">European Single Zero (0)</option>
            </select>
        </div>

        <!-- SCORE DISPLAY -->
        <div class="score-section">
            <div class="score-label">Table Strength Score</div>
            <div class="score-display">
                <div class="score-number" id="scoreDisplay">0</div>
                <div class="score-status">
                    <div class="status-label" id="statusLabel">ENTER SPINS</div>
                    <div class="status-bar">
                        <div class="status-bar-fill" id="statusBarFill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SPIN HISTORY -->
        <div class="history-section">
            <div class="section-title">
                Spin History
                <span class="spin-count"><span id="spinCount">0</span>/20</span>
            </div>
            <div class="chips-container" id="chipsContainer">
                <span class="empty-state">Click numbers to enter spins</span>
            </div>
            <div class="history-buttons">
                <button class="btn-small" onclick="app.undo()">↶ Undo</button>
                <button class="btn-small" onclick="app.clear()">🗑️ Clear</button>
            </div>
        </div>

        <!-- NUMBER INPUT GRID -->
        <div class="numbers-section">
            <div class="section-title">Select Numbers</div>
            <div class="numbers-grid" id="numbersGrid"></div>
        </div>

        <!-- PREDICTIONS -->
        <div class="predictions-section" id="predictionsSection"></div>

        <!-- HEATMAP -->
        <div class="heatmap-section" id="heatmapSection">
            <div class="section-title">Number Frequency Heatmap</div>
            <div class="heatmap-grid" id="heatmapGrid"></div>
        </div>
    </div>

    <div class="footer">
        <p>All computations run offline • No external APIs • Casino Analysis Tool</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
